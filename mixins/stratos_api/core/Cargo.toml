[package]
name = "stratos-api-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Version negotiation and guarded native-build integration for StratosAPI"
build = "build.rs"

[dependencies]
semver = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
